server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: agri-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agripredict}
    username: ${SPRING_DATASOURCE_USERNAME:agriuser}
    password: ${SPRING_DATASOURCE_PASSWORD:agrisecretpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate # Database structure managed strictly by Flyway
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# Custom AgriAI Configuration Parameters
agri:
  jwt:
    secret: ${JWT_SECRET:4c9a8f27e1d54b689a74c3e85291b58df8a21d6e4b938c5a27194f6e3a8b2d1c}
    expiration-hours: 24
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket-raw: soil-images-raw
    bucket-processed: soil-images-processed
    bucket-heatmaps: gradcam-outputs
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
  weather:
    api-key: ${OPENWEATHER_API_KEY:}
    cache-ttl-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
